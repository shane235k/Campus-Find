{% if messages %}
<div class="container mt-3">
  {% for message in messages %}
  <div class="alert alert-dismissible fade show rounded-4 shadow-sm border border-2 {% if message.tags == 'error' or message.tags == 'danger' %}border-dark bg-white text-dark{% else %}border-success bg-white text-dark{% endif %}" role="alert">
    <div class="d-flex align-items-center gap-2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <span>{{ message }}</span>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="background: none; border: none; font-size: 1.1rem; opacity: 0.6; line-height: 1; cursor: pointer;">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
